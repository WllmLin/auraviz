    <ellipse cx="465" cy="435" rx="84" ry="57" fill="#ffffff" opacity="0.20" transform="rotate(-22 465 435)"/>
    <path d="M373 526C403 526 410 471 440 471C471 471 477 574 508 574C539 574 547 437 578 437C609 437 615 526 651 526" fill="none" stroke="#ffffff" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
