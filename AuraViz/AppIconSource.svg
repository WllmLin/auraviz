    <path d="M80 328C213 118 421 63 628 102C777 130 896 228 955 367V180C955 108 916 69 844 69H180C108 69 69 108 69 180V352Z" fill="#ffffff" opacity="0.055" clip-path="url(#tileClip)"/>
    <circle cx="512" cy="512" r="365" fill="url(#aura)"/>

