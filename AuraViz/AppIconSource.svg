<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11152c"/>
      <stop offset="0.52" stop-color="#090a17"/>
      <stop offset="1" stop-color="#220b2e"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67f5ff"/>
      <stop offset="0.48" stop-color="#8d72ff"/>
      <stop offset="1" stop-color="#ff4fc4"/>
    </linearGradient>
    <radialGradient id="core" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#bfeeff"/>
      <stop offset="0.63" stop-color="#7964df"/>
      <stop offset="1" stop-color="#241442"/>
